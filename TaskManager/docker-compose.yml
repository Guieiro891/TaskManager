version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrongPassword123!
    ports:
      - "1433:1433"
    networks:
      - taskmanager-network

  api:
    build:
      context: .
      dockerfile: TaskManager.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=TaskManagerDb;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;
    ports:
      - "5000:5000"
    depends_on:
      - db
    networks:
      - taskmanager-network

networks:
  taskmanager-network:
    driver: bridge